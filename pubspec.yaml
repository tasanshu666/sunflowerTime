name: sunflower_time
description: 《向日葵专注 SunFocus》MVP 三个 spike（S1/S2/S3）最小可运行工程。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # S3 打盹屏专注页：屏幕常亮 + 真实方向检测（架构设计 §1.2 / §1.3）
  wakelock_plus: ^1.2.0
  native_device_orientation: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # S2 为纯逻辑，提供纯 Dart 测试入口（dart test 不依赖 Flutter 引擎，规避沙箱环境 flutter_tester 连接问题）
  test: ^1.24.0

flutter:
  uses-material-design: true
