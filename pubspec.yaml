name: sunflower_time
description: 《向日葵专注 SunFocus》MVP（Plan B 无账号单机版）。分支 m0/skeleton：工程/导航/加密本地库/PIN锁/同意流骨架。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # ── 状态管理 + DI（架构设计 §1.1）
  flutter_riverpod: ^2.5.0
  # ── 路由（声明式，横竖屏页切换 / 深层链接，§1.1）
  go_router: ^14.0.0
  # ── 本地关系型 DB + 加密（Drift + SQLCipher，§10.4 C13）
  drift: ^2.20.0
  # 只保留 SQLCipher 版：sqlite3_flutter_libs 与 sqlcipher_flutter_libs 共用同一个
  # Android namespace（eu.simonbinder.sqlite3_flutter_libs），同时存在会让 AGP 报
  # "Namespace ... is used in multiple modules and/or libraries" 而构建失败。
  # 本工程用 SQLCipher（hook name_android: sqlcipher），普通版无需引入。
  sqlcipher_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  # ── 简单 KV 设置（§1.1）
  shared_preferences: ^2.2.0
  # ── 家长 PIN 哈希 + salt 存系统安全区（§4.9 / §10.4）
  flutter_secure_storage: ^9.0.0
  # ── ID（实体主键，§1.1）
  uuid: ^4.0.0
  # ── 家长 PIN 哈希（sha256 + salt，§4.9 / §10.4）
  crypto: ^3.0.3
  # ── 时间/区域（月池重置 / 夜间边界，§1.1）
  intl: ^0.19.0
  # ── S3 已验证：屏幕常亮 + 真实方向检测（§1.3）
  wakelock_plus: ^1.2.0
  native_device_orientation: ^2.0.0
  # ── 音频播放（M2 音频模块，§1.1）：单例播放器，资源缺失静默降级
  just_audio: ^0.9.42

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # S2 纯逻辑单测入口（dart test 不依赖 Flutter 引擎）
  test: ^1.24.0
  # QA 行为级音频复验：对 just_audio 的平台接口打桩（记录型假平台）。
  just_audio_platform_interface: ^4.6.0
  # Drift 代码生成
  drift_dev: ^2.20.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/sfx/
    - assets/audio/bgm/
    # 植物美术资源（2026-09-22 渲染抽象）：按「{speciesId}_{stage}_{status}.png」
    # 命名丢进本目录即自动生效，缺失时回退内置自绘。命名规范见
    # lib/presentation/child/widgets/plant_artwork.dart 顶部文档注释。
    - assets/plants/
    # 花盆美术资源（2026-09-23）：通用空花盆 pot.png，缺失时回退内置 CustomPaint 自绘。
    - assets/pots/
    # 花园背景图（2026-09-23）：background.png，缺失时回退绿色渐变+草叶纹理自绘。
    - assets/garden/
    # 序列帧资源（2026-09-28）：成长过渡帧 grow/、浇水·施肥效果层帧 care/。
    # ⚠️ 目录声明**不递归**，必须把**叶子目录**逐个列全（漏一行 = 帧不进包 =
    # Image.asset errorBuilder 静默吞 → 只剩音效没有动画，2026-09-28 实证翻车）；
    # care/ 目录**禁止**跑归一化脚本。命名与规格见 `docs/美术资源_序列帧与音频命名规范_v1.md`。
    - assets/fx/grow/sunflower/seed_to_sprout/
    - assets/fx/grow/sunflower/sprout_to_adult/
    - assets/fx/grow/sunflower/adult_to_bloomed/
    - assets/fx/care/water/
    - assets/fx/care/fertilize/
    # 除草 / 除虫效果帧（2026-10-03 玄参交付，各 27 帧）：点干扰物播放，禁止归一化。
    - assets/fx/care/weed/
    - assets/fx/care/pest/
    # 专注页向日葵序列帧（2026-09-29 玄参交付）：常态 idle 循环 / 1-3 进度收集阳光 /
    # 结算庆祝 / 回来 四组，**各组帧数不同**（13/40/36/30）。同样受「目录声明不递归」
    # 约束 —— 四个叶子目录必须逐个列全。命名与规格见
    # `docs/美术资源_序列帧与音频命名规范_v1.md`。
    - assets/fx/focus/sunflower/idle/
    - assets/fx/focus/sunflower/collect/
    - assets/fx/focus/sunflower/settle/
    - assets/fx/focus/sunflower/return/
    # 护眼卡序列帧（2026-10-05 玄参交付）：整幅画面带背景（720×720，不归一化），
    # 五段素材组成 63s 播放列表（close/doitagain/lookTip/look/done）——
    # 「目录声明不递归」约束同上，五个叶子目录必须逐个列全。
    - assets/fx/eyecare/close/
    - assets/fx/eyecare/doitagain/
    - assets/fx/eyecare/lookTip/
    - assets/fx/eyecare/look/
    - assets/fx/eyecare/done/
    # 奖励物美术资源（2026-09-27 奖励物图标化）：sunlight/fragment/seed[_物种id].png，
    # 命名见 `assets/rewards/README.txt`；缺失时头顶奖励图标回退内置 Icons。
    - assets/rewards/

# ── 原生资产（native assets / hooks）配置 ────────────────────────────
# sqlite3 包默认会从 GitHub Releases 下载预编译库（libsqlite3.arm.android.so 等）。
# 本机代理屏蔽 github.com（502 Proxy failed to establish tunnel），下载必然失败，
# 导致 `flutter build apk` 报 "Target dart_build failed: Building native assets failed"。
# 改为 source: system —— 不下载、不编译，直接使用随包/系统提供的动态库：
#   · Android：由 sqlcipher_flutter_libs 经 Maven (net.zetetic:android-database-sqlcipher)
#     提供 libsqlcipher.so（ABI 兼容 sqlite3），配合 open.overrideFor 打开 SQLCipher；
#   · macOS：dlopen 系统 libsqlite3（dyld shared cache，供 dart test 使用）。
hooks:
  user_defines:
    sqlite3:
      source: system
      name_android: sqlcipher
