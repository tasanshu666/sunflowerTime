name: sunflower_time
description: 《小小葵番茄钟 Tiny Sunflower》MVP（Plan B 无账号单机版）。分支 m0/skeleton：工程/导航/加密本地库/PIN锁/同意流骨架。
publish_to: 'none'
version: 1.0.0+2105

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # ── i18n（B1 批次）：官方本地化 delegates（Material/Widgets/Cupertino）──────
  flutter_localizations:
    sdk: flutter
  # ── 状态管理 + DI（架构设计 §1.1）
  flutter_riverpod: ^2.5.0
  # ── 路由（声明式，横竖屏页切换 / 深层链接，§1.1）
  go_router: ^14.0.0
  # ── 本地关系型 DB + 加密（Drift + SQLCipher，§10.4 C13）
  drift: ^2.20.0
  # 只保留 SQLCipher 版：sqlite3_flutter_libs 与 sqlcipher_flutter_libs 共用同一个
  # Android namespace（eu.simonbinder.sqlite3_flutter_libs），同时存在会让 AGP 报
  # "Namespace ... is used in multiple modules and/or libraries" 而构建失败。
  # 本工程用 SQLCipher（hook name_android: sqlcipher），普通版无需引入。
  sqlcipher_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  # ── 简单 KV 设置（§1.1）
  shared_preferences: ^2.2.0
  # ── 家长 PIN 哈希 + salt 存系统安全区（§4.9 / §10.4）
  flutter_secure_storage: ^9.0.0
  # ── ID（实体主键，§1.1）
  uuid: ^4.0.0
  # ── 家长 PIN 哈希（sha256 + salt，§4.9 / §10.4）
  crypto: ^3.0.3
  # ── 时间/区域（月池重置 / 夜间边界，§1.1）
  # 0.19 → 0.20.2（i18n B1）：flutter_localizations（随 Flutter 3.44）强制要求
  # intl 0.20.x；项目内用法仅 DateFormat（0.20 完全兼容）。
  intl: ^0.20.2
  # ── S3 已验证：屏幕常亮 + 真实方向检测（§1.3）
  wakelock_plus: ^1.2.0
  native_device_orientation: ^2.0.0
  # ── 音频播放（M2 音频模块，§1.1）：单例播放器，资源缺失静默降级
  just_audio: ^0.9.42
  # ── 内购（付费墙 · 阶段 2）：一次性永久买断（Non-Consumable）。
  # 用**全平台包** in_app_purchase（含 iOS StoreKit + Android Play Billing 适配），
  # 而非只引入 in_app_purchase_storekit：API 是一等公民，Android 版将来必然接入。
  in_app_purchase: ^3.3.1
  # ── 外部链接（F166）：家长端「关于与反馈」→ 唤起邮件 App / 系统浏览器。
  # 纯 UI 跳转，不申请任何系统敏感权限（相机/麦克风/相册/定位/通讯录/ATT/蓝牙/
  # 运动/语音识别/媒体库/健康 均无调用）→ 不触发 iOS 隐私串，无需新增 UsageDescription。
  # onboarding 审核铁律仍要求：接入后复核二进制敏感符号（见 `docs/上架执行手册`）。
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # S2 纯逻辑单测入口（dart test 不依赖 Flutter 引擎）
  test: ^1.24.0
  # QA 行为级音频复验：对 just_audio 的平台接口打桩（记录型假平台）。
  just_audio_platform_interface: ^4.6.0
  # Drift 代码生成
  drift_dev: ^2.20.0
  build_runner: ^2.4.0

flutter:
  # i18n（B1 批次）：启用 gen-l10n（配置见根目录 l10n.yaml，产物在 lib/l10n/generated）。
  generate: true
  uses-material-design: true
  assets:
    - assets/audio/sfx/
    - assets/audio/bgm/
    # 植物美术资源（2026-09-22 渲染抽象）：按「{speciesId}_{stage}_{status}.png」
    # 命名丢进对应**物种子目录**即自动生效，缺失时回退内置自绘。命名规范与
    # 目录结构见 lib/presentation/child/widgets/plant_artwork.dart 顶部文档注释。
    # 2026-10-08 目录重组：按物种分目录（6 物种 + shared 通用级）；⚠️ 目录声明
    # **不递归**，必须把叶子目录逐个列全（漏一行 = 图静默不进包）。
    - assets/plants/sunflower/
    - assets/plants/tomato/
    - assets/plants/strawberry/
    - assets/plants/moon_orchid/
    - assets/plants/coral_orchid/
    - assets/plants/jade_hydrangea/
    - assets/plants/grape/
    - assets/plants/rose/
    - assets/plants/shared/
    # 花盆美术资源（2026-09-23）：通用空花盆 pot.png，缺失时回退内置 CustomPaint 自绘。
    - assets/pots/
    # 花园背景图（2026-09-23）：background.png，缺失时回退绿色渐变+草叶纹理自绘。
    - assets/garden/
    # 序列帧资源（2026-09-28）：成长过渡帧 grow/、浇水·施肥效果层帧 care/。
    # ⚠️ 目录声明**不递归**，必须把**叶子目录**逐个列全（漏一行 = 帧不进包 =
    # Image.asset errorBuilder 静默吞 → 只剩音效没有动画，2026-09-28 实证翻车）；
    # care/ 目录**禁止**跑归一化脚本。命名与规格见 `docs/美术资源_序列帧与音频命名规范_v1.md`。
    - assets/fx/grow/sunflower/seed_to_sprout/
    - assets/fx/grow/sunflower/sprout_to_adult/
    - assets/fx/grow/sunflower/adult_to_bloomed/
    # 五物种三段成长帧（2026-10-12 交付开花段 / 2026-10-13 补齐另两段；各组 25~27 张
    # ≠ kFxFrameCount，帧数由 AssetManifest 实测，见 C57）：
    - assets/fx/grow/tomato/seed_to_sprout/
    - assets/fx/grow/tomato/sprout_to_adult/
    - assets/fx/grow/tomato/adult_to_bloomed/
    - assets/fx/grow/strawberry/seed_to_sprout/
    - assets/fx/grow/strawberry/sprout_to_adult/
    - assets/fx/grow/strawberry/adult_to_bloomed/
    - assets/fx/grow/moon_orchid/seed_to_sprout/
    - assets/fx/grow/moon_orchid/sprout_to_adult/
    - assets/fx/grow/moon_orchid/adult_to_bloomed/
    - assets/fx/grow/coral_orchid/seed_to_sprout/
    - assets/fx/grow/coral_orchid/sprout_to_adult/
    - assets/fx/grow/coral_orchid/adult_to_bloomed/
    - assets/fx/grow/jade_hydrangea/seed_to_sprout/
    - assets/fx/grow/jade_hydrangea/sprout_to_adult/
    - assets/fx/grow/jade_hydrangea/adult_to_bloomed/
    - assets/fx/grow/grape/seed_to_sprout/
    - assets/fx/grow/grape/sprout_to_adult/
    - assets/fx/grow/grape/adult_to_bloomed/
    - assets/fx/grow/rose/seed_to_sprout/
    - assets/fx/grow/rose/sprout_to_adult/
    - assets/fx/grow/rose/adult_to_bloomed/
    - assets/fx/care/water/
    - assets/fx/care/fertilize/
    # 除草 / 除虫效果帧（2026-10-03 玄参交付，各 27 帧）：点干扰物播放，禁止归一化。
    - assets/fx/care/weed/
    - assets/fx/care/pest/
    # 专注页向日葵序列帧（2026-09-29 玄参交付）：常态 idle 循环 / 1-3 进度收集阳光 /
    # 结算庆祝 / 回来 四组，**各组帧数不同**（13/40/36/30）。同样受「目录声明不递归」
    # 约束 —— 四个叶子目录必须逐个列全。命名与规格见
    # `docs/美术资源_序列帧与音频命名规范_v1.md`。
    - assets/fx/focus/sunflower/idle/
    - assets/fx/focus/sunflower/collect/
    - assets/fx/focus/sunflower/settle/
    - assets/fx/focus/sunflower/return/
    # 护眼卡序列帧（2026-10-09 C43 玄参交付改版）：单段 640 帧 720×720 整幅画面
    # （5 段素材已拼为 1 段视频再逐帧导出，过渡更丝滑），WebP q95 压缩
    # （284.4M PNG → 40.2M，PSNR≈44.8dB 视觉无损，转换 tools/convert_eyecare640.py）。
    - assets/fx/eyecare640/
    # 护眼英文素材（F152，2026-10-25）：594 帧 WebP q95（tools/convert_eyecare640.py
    # --src/--dst，254M→38M，PSNR≈44.8dB），配音 assets/audio/sfx/eyecare_en.mp3 59.45s。
    - assets/fx/eyecare640_en/
    # 隐私政策应用内全文（首启告知 2.0 / C110）：由 tools/gen_privacy_assets.py
    # 从 docs 底稿派生（勿手改）；locale 选文件见 privacy_policy_page.dart。
    - assets/docs/
    # 奖励物美术资源（2026-09-27 奖励物图标化）：sunlight/fragment/seed[_物种id].png，
    # 命名见 `assets/rewards/README.txt`；缺失时头顶奖励图标回退内置 Icons。
    - assets/rewards/
    # Tab 整页背景（2026-10-09 玄参交付，C44）：今日/成长/商店沉浸式底图，
    # 「上半场景 + 下半留白」设计，BoxFit.cover topCenter 铺满。
    # ⚠️ store01/store03 已入库备选但**不登记**（玄参拍板先用 store02 试用；
    #    换背景 = 改 kStoreBgAsset 常量 + 在此登记对应文件）。
    - assets/backgrounds/today.webp
    - assets/backgrounds/growth.webp
    - assets/backgrounds/store02.webp
    # C74 升级演出序列帧（2026-10-14 玄参交付，**两套**）：
    #  · defaultLevelUp/ 36 帧 → 普通升级（非称号节点）；
    #  · 5leveUp/ 41 帧 → 9 个称号节点（⚠️ 目录名按交付原样，少一个 `l`）。
    # ⚠️ **目录声明不递归**（C18 教训），两个叶子目录必须逐个列全；帧数不写死，
    # 运行期由 `resolveFxFrames` 读 AssetManifest 实测。
    - assets/fx/levelUp/defaultLevelUp/
    - assets/fx/levelUp/5leveUp/
    # 成长项/奖励 卡片图标（2026-10-09 玄参交付，C44）：512×512 透明 WebP，
    # 按名称关键词映射（单点收口见 growth_icons.dart），缺失/失败回退马卡龙色块+图标。
    - assets/ui/growth/
    - assets/ui/store/

# ── 原生资产（native assets / hooks）配置 ────────────────────────────
# sqlite3 包默认会从 GitHub Releases 下载预编译库（libsqlite3.arm.android.so 等）。
# 本机代理屏蔽 github.com（502 Proxy failed to establish tunnel），下载必然失败，
# 导致 `flutter build apk` 报 "Target dart_build failed: Building native assets failed"。
# 改为 source: system —— 不下载、不编译，直接使用随包/系统提供的动态库：
#   · Android：由 sqlcipher_flutter_libs 经 Maven (net.zetetic:android-database-sqlcipher)
#     提供 libsqlcipher.so（ABI 兼容 sqlite3），配合 open.overrideFor 打开 SQLCipher；
#   · macOS：dlopen 系统 libsqlite3（dyld shared cache，供 dart test 使用）。
hooks:
  user_defines:
    sqlite3:
      source: system
      name_android: sqlcipher
